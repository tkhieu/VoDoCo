[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vodoco-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0+cu128",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "safetensors==0.8.0",
  "sentencepiece==0.2.1",
  "numpy==2.2.6",
  "python-crfsuite==0.9.12",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]
export = [
  "pyarrow==21.0.0",
  "scikit-learn==1.9.1",
  "sklearn-crfsuite==0.5.0",
  "seqeval==1.2.2",
]

[project.scripts]
vodoco-preflight = "vodoco_inference.preflight:main"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
